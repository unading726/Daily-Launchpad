<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Launchpad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#F7F6F2;
  --surf:#FFFFFF;
  --surf2:#F0EEE9;
  --surf3:#E8E6DF;
  --hover:#ECEAE4;
  --bd:rgba(0,0,0,.07);
  --bd2:rgba(0,0,0,.13);
  --tx:#17160E;
  --tx2:#6A6858;
  --tx3:#AEAC9F;
  --ac:#C96442;
  --ac-dim:#F5E8E3;
  --ac-bd:#E8C4B2;
  --ac-hover:#B85A39;
  --green:#2B7A50;
  --green-dim:#E7F3EC;
  --amber:#8B6008;
  --amber-dim:#FDF0D9;
  --r:13px;
  --rs:8px;
  --rp:100px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.09),0 2px 4px rgba(0,0,0,.05);
}

@media(prefers-color-scheme:dark){:root{
  --bg:#141310;--surf:#1C1B18;--surf2:#242320;--surf3:#2C2A27;--hover:#2E2C29;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --tx:#F0EDE5;--tx2:#8A876F;--tx3:#4C4A42;
  --ac:#D97358;--ac-dim:#251B17;--ac-bd:#3D2318;--ac-hover:#E8845F;
  --green:#4CC07B;--green-dim:#142217;--amber:#E8B040;--amber-dim:#221A08;
}}

body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tx);
  min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:2.25rem 1rem 5rem;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

.app{width:100%;max-width:480px;position:relative}

/* ── Overlay backdrop ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeOverlay .15s ease;backdrop-filter:blur(2px)}
@keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
.overlay-panel{background:var(--surf);border-radius:var(--r) var(--r) 0 0;
  width:100%;max-width:480px;padding:1.5rem;
  animation:slideUp .2s cubic-bezier(.32,.72,0,1);max-height:85vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
.header-left{display:flex;align-items:center;gap:9px}
.logo-mark{width:29px;height:29px;background:var(--ac);border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:14px;height:14px;fill:rgba(255,255,255,.92)}
.logo-name{font-size:14px;font-weight:500;color:var(--tx2);letter-spacing:-.01em}
.header-right{display:flex;align-items:center;gap:6px}
.header-btn{width:32px;height:32px;border-radius:var(--rs);background:var(--surf2);
  border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;color:var(--tx2)}
.header-btn:hover{background:var(--hover);color:var(--tx)}
.header-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.streak-badge{display:flex;align-items:center;gap:4px;padding:4px 9px;
  background:var(--amber-dim);border:1px solid rgba(139,96,8,.15);
  border-radius:var(--rp);font-size:12px;font-weight:500;color:var(--amber)}
@media(prefers-color-scheme:dark){.streak-badge{border-color:rgba(232,176,64,.15)}}
.date-badge{font-size:12px;color:var(--tx2);background:var(--surf2);
  border:1px solid var(--bd);border-radius:var(--rp);padding:4px 10px}

/* ── Phase strip ── */
.phase-strip{display:flex;align-items:center;gap:6px;margin-bottom:1.75rem}
.ph-node{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3);transition:color .2s}
.ph-node.active{color:var(--ac);font-weight:500}
.ph-node.done{color:var(--green)}
.ph-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.ph-line{flex:1;height:1px;background:var(--bd)}

/* ── Cards ── */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.card-pad{padding:1.5rem}
.card-foot{padding:0 1.5rem 1.5rem;display:flex;gap:8px}

/* ── Typography ── */
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:.875rem}
.subtext{font-size:13px;color:var(--tx3);line-height:1.6;margin-bottom:1.25rem}

/* ── Rollover banner ── */
.rollover-banner{display:flex;align-items:flex-start;gap:10px;
  background:var(--amber-dim);border:1px solid rgba(139,96,8,.18);
  border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
@media(prefers-color-scheme:dark){.rollover-banner{border-color:rgba(232,176,64,.18)}}
.rollover-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.rollover-text{flex:1;font-size:13px;color:var(--tx2);line-height:1.5}
.rollover-text strong{color:var(--tx);font-weight:500}
.rollover-actions{display:flex;gap:6px;margin-top:8px}
.rollover-btn{padding:5px 10px;border-radius:var(--rs);font-family:inherit;
  font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid}
.rollover-btn.primary{background:var(--amber);border-color:var(--amber);color:#fff}
.rollover-btn.primary:hover{filter:brightness(1.1)}
.rollover-btn.ghost{background:transparent;border-color:var(--bd2);color:var(--tx2)}
.rollover-btn.ghost:hover{background:var(--hover)}

/* ── Task count stepper ── */
.task-count-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.task-count-label{font-size:13px;color:var(--tx2)}
.task-count-ctrl{display:flex;align-items:center;gap:8px}
.count-btn{width:26px;height:26px;border-radius:50%;background:var(--surf2);
  border:1px solid var(--bd);cursor:pointer;font-size:15px;color:var(--tx2);
  display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.count-btn:hover{background:var(--hover)}
.count-btn:disabled{opacity:.35;cursor:not-allowed}
.count-val{font-size:15px;font-weight:500;color:var(--tx);min-width:18px;text-align:center}

/* ── Task rows ── */
.task-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.task-row-wrap{display:flex;align-items:stretch;border:1px solid var(--bd);
  border-radius:var(--rs);background:var(--surf2);transition:all .15s;overflow:hidden}
.task-row-wrap:focus-within{border-color:var(--ac-bd);background:var(--surf);
  box-shadow:0 0 0 3px rgba(201,100,66,.1)}
.task-row-wrap.done-row{opacity:.5}
.energy-btn{width:36px;flex-shrink:0;border:none;background:transparent;
  border-right:1px solid var(--bd);cursor:pointer;font-size:13px;
  transition:background .15s;display:flex;align-items:center;justify-content:center}
.energy-btn:hover{background:var(--hover)}
.task-field{flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;min-height:45px}
.task-num{font-size:11px;font-weight:500;color:var(--tx3);flex-shrink:0;min-width:14px}
.task-inp{flex:1;border:none;background:transparent;font-family:inherit;
  font-size:14px;color:var(--tx);outline:none;padding:10px 0;width:100%}
.task-inp::placeholder{color:var(--tx3)}
.task-inp:disabled{cursor:not-allowed}
.del-btn{width:28px;height:28px;flex-shrink:0;border:none;background:transparent;
  cursor:pointer;color:var(--tx3);display:flex;align-items:center;justify-content:center;
  border-radius:5px;transition:all .15s;margin-right:4px}
.del-btn:hover{background:rgba(201,100,66,.1);color:var(--ac)}
.del-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ── Buttons ── */
.btn-main{width:100%;padding:12px;background:var(--ac);color:#fff;border:none;
  border-radius:var(--rs);font-family:inherit;font-size:15px;font-weight:500;
  cursor:pointer;transition:all .15s;letter-spacing:-.01em}
.btn-main:hover:not(:disabled){background:var(--ac-hover)}
.btn-main:active:not(:disabled){transform:scale(.98)}
.btn-main:disabled{opacity:.35;cursor:not-allowed}
.btn-sec{padding:11px 16px;background:var(--surf2);color:var(--tx2);
  border:1px solid var(--bd);border-radius:var(--rs);font-family:inherit;
  font-size:14px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sec:hover{background:var(--hover);color:var(--tx)}
.btn-sec:active{transform:scale(.98)}
.btn-ghost{background:none;border:none;font-family:inherit;font-size:13px;
  color:var(--tx3);cursor:pointer;padding:8px 10px;transition:color .15s;border-radius:var(--rs)}
.btn-ghost:hover{color:var(--tx2);background:var(--hover)}

/* ── Suggested card ── */
.sugg-card{display:flex;align-items:flex-start;gap:10px;
  border:1px solid var(--ac-bd);border-radius:var(--rs);padding:13px 15px;
  background:var(--ac-dim);margin-bottom:8px;cursor:pointer;transition:all .15s;
  width:100%;font-family:inherit;text-align:left}
.sugg-card:hover{filter:brightness(.97)}
.sugg-badge{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ac);background:rgba(201,100,66,.12);border-radius:var(--rp);
  padding:2px 7px;flex-shrink:0;margin-top:2px}
.sugg-text{font-size:14px;color:var(--tx);line-height:1.5;font-weight:500}

/* ── Other task buttons ── */
.other-tasks{display:flex;flex-direction:column;gap:4px;margin-bottom:1.25rem}
.other-btn{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;
  background:var(--surf2);border:1px solid var(--bd);border-radius:var(--rs);
  font-family:inherit;text-align:left;cursor:pointer;transition:all .15s;
  width:100%;color:var(--tx2);font-size:13px}
.other-btn:hover{background:var(--hover);border-color:var(--bd2);color:var(--tx)}
.other-btn.sel{background:var(--ac-dim);border-color:var(--ac-bd);color:var(--tx)}
.other-btn-num{color:var(--tx3);font-size:11px;margin-top:2px;flex-shrink:0}
.skip-tag{font-size:10px;color:var(--tx3);background:var(--surf3);
  border-radius:var(--rp);padding:1px 6px;margin-left:auto;flex-shrink:0}

/* ── Duration control ── */
.dur-row{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.dur-adj{width:28px;height:28px;border-radius:50%;background:var(--surf2);
  border:1px solid var(--bd);cursor:pointer;font-size:16px;color:var(--tx2);
  display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.dur-adj:hover{background:var(--hover)}
.dur-val{font-size:20px;font-weight:500;letter-spacing:-.02em;min-width:32px;text-align:center}
.dur-unit{font-size:13px;color:var(--tx3)}
.dur-mode{font-size:12px;color:var(--tx3);margin-left:2px}

/* ── Focus / Timer ── */
.timer-wrap{padding:2rem 1.5rem 1.75rem;text-align:center}
.focus-task-line{font-size:13px;color:var(--tx2);margin-bottom:1.75rem;
  display:flex;align-items:flex-start;justify-content:center;gap:0}
.focus-task-text{color:var(--tx);font-weight:500;font-size:14px;line-height:1.5}

.ring-wrap{position:relative;width:176px;height:176px;margin:0 auto 1.75rem}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bd2);stroke-width:2.5}
.ring-fg{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;
  transition:stroke-dashoffset 1s linear}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring-time{font-size:36px;font-weight:300;letter-spacing:-.04em;line-height:1}
.ring-status{font-size:11px;color:var(--tx3);margin-top:4px}

.timer-actions{display:flex;align-items:center;justify-content:center;
  gap:12px;position:relative}
.play-btn{width:50px;height:50px;border-radius:50%;background:var(--ac);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;box-shadow:0 2px 12px rgba(201,100,66,.3)}
.play-btn:hover{background:var(--ac-hover);box-shadow:0 4px 20px rgba(201,100,66,.4)}
.play-btn:active{transform:scale(.94)}
.play-btn svg{width:17px;height:17px;fill:#fff}
.play-btn.is-pause svg{margin:0}
.play-btn.is-play svg{margin-left:2px}
@keyframes pulse-glow{0%,100%{box-shadow:0 2px 12px rgba(201,100,66,.3)}
  50%{box-shadow:0 2px 24px rgba(201,100,66,.55)}}
.pulse{animation:pulse-glow 2s infinite}

/* ── Progress pills ── */
.progress-pills{display:flex;gap:5px;margin-bottom:1.5rem}
.prog-pill{flex:1;padding:5px 8px;border-radius:var(--rp);font-size:11px;
  text-align:center;border:1px solid var(--bd);color:var(--tx3);
  background:var(--surf2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:all .2s}
.prog-pill.active{background:var(--ac-dim);border-color:var(--ac-bd);
  color:var(--ac);font-weight:500}
.prog-pill.done{background:var(--green-dim);border-color:transparent;
  color:var(--green);text-decoration:line-through}
.prog-pill.skip{opacity:.4;text-decoration:line-through}

/* ── Reflect ── */
.prog-btns{display:flex;gap:6px;margin-bottom:1.25rem}
.prog-btn{flex:1;padding:9px 6px;border:1px solid var(--bd);border-radius:var(--rs);
  background:var(--surf2);font-family:inherit;font-size:13px;color:var(--tx2);
  cursor:pointer;transition:all .15s;text-align:center}
.prog-btn:hover{background:var(--hover)}
.prog-btn.sel{background:var(--ac-dim);border-color:var(--ac-bd);color:var(--ac);font-weight:500}
.next-inp{width:100%;padding:10px 12px;background:var(--surf2);border:1px solid var(--bd);
  border-radius:var(--rs);font-family:inherit;font-size:14px;color:var(--tx);
  outline:none;transition:all .2s}
.next-inp::placeholder{color:var(--tx3)}
.next-inp:focus{border-color:var(--ac-bd);background:var(--surf);
  box-shadow:0 0 0 3px rgba(201,100,66,.1)}

/* ── Summary ── */
.done-icon{width:52px;height:52px;border-radius:50%;background:var(--green-dim);
  display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem}
.done-icon svg{width:24px;height:24px;stroke:var(--green);fill:none;
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.summary-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--bd)}
.summary-row:last-child{border:none}
.summary-task{font-size:13px;color:var(--tx2);flex:1;line-height:1.4}
.summary-status{font-size:12px;font-weight:500;flex-shrink:0}
.summary-status.done{color:var(--green)}
.summary-status.skip{color:var(--tx3)}

/* ── Settings panel ── */
.settings-title{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-bottom:1.5rem;
  display:flex;align-items:center;justify-content:space-between}
.settings-row{display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--bd)}
.settings-row:last-of-type{border:none}
.settings-label{font-size:14px;color:var(--tx)}
.settings-sub{font-size:12px;color:var(--tx3);margin-top:1px}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--surf3);
  border:1px solid var(--bd2);cursor:pointer;position:relative;transition:all .2s;flex-shrink:0}
.toggle.on{background:var(--ac);border-color:var(--ac)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;
  background:#fff;top:2px;left:2px;transition:transform .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(18px)}
.kbd{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx3)}
.kbd kbd{background:var(--surf2);border:1px solid var(--bd2);border-radius:4px;
  padding:2px 6px;font-family:inherit;font-size:11px;color:var(--tx2)}

/* ── Divider ── */
.hr{height:1px;background:var(--bd);margin:1.25rem 0}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .2s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.shake{animation:shake .3s ease}
</style>
</head>
<body>
<div class="app" id="app">
  <div style="padding:40px;text-align:center;color:#6A6858;">加载中...</div>
</div>
<div id="overlay-root"></div>

<script>
// 整个脚本包裹在极限防护容器中
(function() {
  try {

// ─────────────────────────────────────────────
//  安全的本地存储与降级机制 (防御 SecurityError)
// ─────────────────────────────────────────────
let storageAvailable = false;
let memoryStore = {};

try {
  const testKey = '__launchpad_test__';
  window.localStorage.setItem(testKey, testKey);
  window.localStorage.removeItem(testKey);
  storageAvailable = true;
} catch (e) {
  storageAvailable = false;
  console.warn("localStorage is blocked by sandbox environment. Falling back to memory storage.");
}

const Store = {
  get: function(key) {
    if (storageAvailable) {
      try { return window.localStorage.getItem(key); } catch(e) { return null; }
    } else {
      return memoryStore[key] || null;
    }
  },
  set: function(key, val) {
    if (storageAvailable) {
      try { window.localStorage.setItem(key, val); } catch(e) {}
    } else {
      memoryStore[key] = val;
    }
  },
  del: function(key) {
    if (storageAvailable) {
      try { window.localStorage.removeItem(key); } catch(e) {}
    } else {
      delete memoryStore[key];
    }
  }
};

// ─────────────────────────────────────────────
//  Constants
// ─────────────────────────────────────────────
const C = 2 * Math.PI * 80;
const KEYS = { SAVE:'launchpad_v3', SET:'launchpad_set', STREAK:'launchpad_streak', HIST:'launchpad_hist' };
const ENERGY = [{k:'high',i:'🔴',l:'深度'},{k:'med',i:'🟡',l:'常规'},{k:'low',i:'🟢',l:'轻松'}];
const PROG_OPTS = ['完成了','推进了','暂时跳过'];

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let SETTINGS = { taskCount:3, defaultDuration:25, sound:true };
let S = newState();
let STREAK = { count:0, lastDate:'', longest:0 };
let _timer = null;
let _rolloverTasks = [];

function newState(taskCount) {
  const n = taskCount || SETTINGS.taskCount || 3;
  return {
    phase:'plan',
    tasks: Array.from({length:n}, function(){ return {text:'',energy:'med',skipped:false} }),
    suggested:0, chosen:-1,
    duration: SETTINGS.defaultDuration || 25,
    timeLeft:0, totalTime:0,
    running:false, paused:false,
    completedSessions:[],
    focusTask:'', focusEnergy:'med',
    reflectProgress:'', reflectNext:'',
  };
}

// ─────────────────────────────────────────────
//  Persistence
// ─────────────────────────────────────────────
function load() {
  const raw = Store.get(KEYS.SAVE);
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    const date = parsed.date;
    const state = parsed.state || {};
    const today = new Date().toDateString();
    
    if (date === today) {
      S = Object.assign({}, newState(), state, {running: false});
      S.completedSessions = S.completedSessions || [];
      S.tasks = S.tasks || [];
    } else {
      const tasks = state.tasks || [];
      const pastSessions = state.completedSessions || [];
      _rolloverTasks = tasks.filter(function(t) {
        return t.text && t.text.trim() && !pastSessions.find(function(s){ return s.task === t.text; });
      });
    }
  } catch(e) {
    console.error('Data parse error', e);
  }
}

function save() {
  Store.set(KEYS.SAVE, JSON.stringify({
    date: new Date().toDateString(),
    state: Object.assign({}, S, {running: false})
  }));
}

function loadSettings() {
  const raw = Store.get(KEYS.SET);
  if (raw) {
    try { SETTINGS = Object.assign({}, SETTINGS, JSON.parse(raw)); } catch(e){}
  }
}

function saveSettings() {
  Store.set(KEYS.SET, JSON.stringify(SETTINGS));
}

function loadStreak() {
  const raw = Store.get(KEYS.STREAK);
  if (raw) {
    try { STREAK = Object.assign({}, STREAK, JSON.parse(raw)); } catch(e){}
  }
}

function saveStreak() {
  Store.set(KEYS.STREAK, JSON.stringify(STREAK));
}

function recordStreakDay() {
  const today = new Date().toDateString();
  if (STREAK.lastDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  STREAK.count = STREAK.lastDate === yesterday ? STREAK.count + 1 : 1;
  STREAK.longest = Math.max(STREAK.longest, STREAK.count);
  STREAK.lastDate = today;
  saveStreak();
}

// ─────────────────────────────────────────────
//  Audio (防御 AudioContext 初始化错误)
// ─────────────────────────────────────────────
function playDone() {
  if (!SETTINGS.sound) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    [[880,.05],[660,.3],[440,.6]].forEach(function(pair) {
      const freq = pair[0];
      const when = pair[1];
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + when);
      gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + when + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + 1.2);
      osc.start(ctx.currentTime + when);
      osc.stop(ctx.currentTime + when + 1.2);
    });
  } catch(e) {
    console.warn("Audio playback disabled by environment.");
  }
}

// ─────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(sec) {
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}
function fmtDate() {
  return new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
}
function durationMode(d) {
  return d <= 15 ? '热身' : d <= 30 ? '番茄' : d <= 50 ? '深度' : '马拉松';
}
function availableTasks() {
  return S.tasks.map(function(t,i){ return Object.assign({}, t, {i: i}); }).filter(function(t){
    return t.text.trim() && !t.skipped && !S.completedSessions.find(function(s){ return s.task === t.text; });
  });
}
function suggestTask() {
  const hour = new Date().getHours();
  const order = hour < 13 ? ['high','med','low'] : hour < 17 ? ['med','high','low'] : ['low','med','high'];
  const avail = availableTasks();
  for (let i=0; i<order.length; i++) {
    const e = order[i];
    const t = avail.find(function(t){ return t.energy === e; });
    if (t) return t.i;
  }
  return avail.length > 0 ? avail[0].i : 0;
}
function hasMore() {
  return availableTasks().length > 0;
}

// ─────────────────────────────────────────────
//  Timer Engine
// ─────────────────────────────────────────────
function startTimer() {
  clearInterval(_timer);
  S.running = true; S.paused = false;
  _timer = setInterval(function(){
    if (!S.running) return;
    if (S.timeLeft <= 0) {
      clearInterval(_timer);
      S.running = false;
      playDone();
      finishSession();
      return;
    }
    S.timeLeft--;
    const rt = document.getElementById('ring-time');
    const rf = document.getElementById('ring-fg');
    if (rt) rt.textContent = fmt(S.timeLeft);
    if (rf) rf.style.strokeDashoffset = String(C*(1-S.timeLeft/S.totalTime));
    const rs = document.getElementById('ring-status');
    if (rs) rs.textContent = '专注中';
    if (S.timeLeft % 30 === 0) save();
  }, 1000);
  render();
}

function pauseTimer() {
  clearInterval(_timer);
  S.running = false; S.paused = true;
  render();
}

function finishSession() {
  S.completedSessions.push({task:S.focusTask, duration:S.duration, progress:''});
  S.phase = 'reflect';
  save(); render();
}

function launchFocus(taskText, taskEnergy) {
  S.focusTask = taskText;
  S.focusEnergy = taskEnergy || 'med';
  S.timeLeft = S.duration * 60;
  S.totalTime = S.duration * 60;
  S.running = false; S.paused = false;
  S.phase = 'focus';
  save(); render();
}

  const app = document.getElementById('app');
  if (!app) return;
  
  if (S.phase==='plan')         app.innerHTML = renderPlan();
  else if (S.phase==='choose')  app.innerHTML = renderChoose();
  else if (S.phase==='focus')   app.innerHTML = renderFocus();
  else if (S.phase==='reflect') app.innerHTML = renderReflect();
  else if (S.phase==='summary') app.innerHTML = renderSummary();
  
  bindEvents();
}

function showSettings() {
  const root = document.getElementById('overlay-root');
  if (!root) return;
  root.innerHTML = renderSettingsPanel();
  bindSettingsEvents();
}

function hideSettings() {
  const root = document.getElementById('overlay-root');
  if (root) root.innerHTML = '';
}

// ─────────────────────────────────────────────
//  Event bindings
// ─────────────────────────────────────────────
function bindEvents() {
  const hdrSettings = document.getElementById('hdr-settings');
  if (hdrSettings) hdrSettings.addEventListener('click', showSettings);

  const hdrEdit = document.getElementById('hdr-edit');
  if (hdrEdit) hdrEdit.addEventListener('click', goEdit);

  const hdrBack = document.getElementById('hdr-back');
  if (hdrBack) hdrBack.addEventListener('click', function(){
    S.phase = S.phase==='reflect'?'choose':'plan';
    render();
  });

  const rAdd = document.getElementById('rollover-add');
  if (rAdd) rAdd.addEventListener('click', function(){
    _rolloverTasks.forEach(function(rt){
      const empty = S.tasks.findIndex(function(t){ return !t.text.trim(); });
      if (empty>=0) S.tasks[empty] = {text:rt.text, energy:rt.energy||'med', skipped:false};
      else S.tasks.push({text:rt.text, energy:rt.energy||'med', skipped:false});
    });
    _rolloverTasks = [];
    save(); render();
  });
  const rSkip = document.getElementById('rollover-skip');
  if (rSkip) rSkip.addEventListener('click', function(){_rolloverTasks=[]; render();});

  const countMinus = document.getElementById('count-minus');
  const countPlus = document.getElementById('count-plus');
  if (countMinus) countMinus.addEventListener('click', function(){
    if (S.tasks.length > 1) { S.tasks.pop(); render(); }
  });
  if (countPlus) countPlus.addEventListener('click', function(){
    if (S.tasks.length < 6) { S.tasks.push({text:'',energy:'med',skipped:false}); render(); }
  });

  S.tasks.forEach(function(_, i){
    const inp = document.getElementById('tinp-' + i);
    if (inp) inp.addEventListener('input', function(e){
      S.tasks[i].text = e.target.value;
      const btn = document.getElementById('btn-lock');
      if (btn) btn.disabled = !S.tasks.some(function(t){ return t.text.trim(); });
    });
    const ebtn = document.getElementById('ebtn-' + i);
    if (ebtn) ebtn.addEventListener('click', function(){
      const idx = ENERGY.findIndex(function(e){ return e.k===S.tasks[i].energy; });
      S.tasks[i].energy = ENERGY[(idx+1)%ENERGY.length].k;
      ebtn.textContent = ENERGY[(idx+1)%ENERGY.length].i;
    });
    const del = document.getElementById('del-' + i);
    if (del) del.addEventListener('click', function(){
      if (S.tasks.length > 1) { S.tasks.splice(i,1); render(); }
    });
  });

  const btnLock = document.getElementById('btn-lock');
  if (btnLock) btnLock.addEventListener('click', doLock);

  const btnSugg = document.getElementById('btn-sugg');
  if (btnSugg) btnSugg.addEventListener('click', function(){
    const t = S.tasks[S.suggested];
    if (t) launchFocus(t.text, t.energy);
  });

  availableTasks().filter(function(t){ return t.i!==S.suggested; }).forEach(function(t){
    const ob = document.getElementById('other-' + t.i);
    if (ob) ob.addEventListener('click', function(e){
      const skipTag = document.getElementById('skip-tag-' + t.i);
      if (skipTag && (e.target===skipTag||skipTag.contains(e.target))) {
        S.tasks[t.i].skipped = true;
        S.suggested = suggestTask();
        save(); render(); return;
      }
      S.chosen = t.i;
      launchFocus(t.text, t.energy);
    });
  });

  const durM = document.getElementById('dur-m');
  const durP = document.getElementById('dur-p');
  if (durM) durM.addEventListener('click', function(){S.duration=Math.max(5,S.duration-5);render();});
  if (durP) durP.addEventListener('click', function(){S.duration=Math.min(90,S.duration+5);render();});

  const btnGo = document.getElementById('btn-go');
  if (btnGo) btnGo.addEventListener('click', function(){
    const avail = availableTasks();
    if (avail.length > 0) launchFocus(avail[0].text, avail[0].energy);
  });

  const btnPlay = document.getElementById('btn-play');
  if (btnPlay) btnPlay.addEventListener('click', function(){S.running?pauseTimer():startTimer();});

  const btnEndSession = document.getElementById('btn-end-session');
  if (btnEndSession) btnEndSession.addEventListener('click', function(){
    clearInterval(_timer); S.running=false;
    finishSession();
  });

  const btnSwitch = document.getElementById('btn-switch-task');
  if (btnSwitch) btnSwitch.addEventListener('click', function(){
    clearInterval(_timer); S.running=false;
    S.suggested = suggestTask();
    S.phase='choose'; save(); render();
  });

  PROG_OPTS.forEach(function(o){
    const b = document.getElementById('prog-' + o);
    if (b) b.addEventListener('click', function(){
      S.reflectProgress=o;
      const btns = document.querySelectorAll('.prog-btn');
      for(let i=0; i<btns.length; i++) btns[i].classList.remove('sel');
      b.classList.add('sel');
    });
  });

  const nextInp = document.getElementById('next-inp');
  if (nextInp) nextInp.addEventListener('input', function(e){ S.reflectNext=e.target.value; });

  const btnContinue = document.getElementById('btn-continue');
  if (btnContinue) btnContinue.addEventListener('click', advanceAfterReflect);

  const btnStop = document.getElementById('btn-stop-today');
  if (btnStop) btnStop.addEventListener('click', function(){S.phase='summary';recordStreakDay();save();render();});

  const btnFinish = document.getElementById('btn-finish-day');
  if (btnFinish) btnFinish.addEventListener('click', function(){S.phase='summary';recordStreakDay();save();render();});

  const btnReset = document.getElementById('btn-reset');
  if (btnReset) btnReset.addEventListener('click', doReset);
}

function bindSettingsEvents() {
  const closeSettingsBtn = document.getElementById('close-settings');
  if (closeSettingsBtn) closeSettingsBtn.addEventListener('click', hideSettings);
  
  const settingsOverlay = document.getElementById('settings-overlay');
  if (settingsOverlay) settingsOverlay.addEventListener('click', function(e){
    if (e.target.id === 'settings-overlay') hideSettings();
  });

  const setTcM = document.getElementById('set-tc-m');
  const setTcP = document.getElementById('set-tc-p');
  const setTcVal = document.getElementById('set-tc-val');
  if (setTcM) setTcM.addEventListener('click', function(){
    SETTINGS.taskCount = Math.max(1, SETTINGS.taskCount-1);
    if(setTcVal) setTcVal.textContent = SETTINGS.taskCount; 
    saveSettings();
  });
  if (setTcP) setTcP.addEventListener('click', function(){
    SETTINGS.taskCount = Math.min(6, SETTINGS.taskCount+1);
    if(setTcVal) setTcVal.textContent = SETTINGS.taskCount; 
    saveSettings();
  });

  const setDurM = document.getElementById('set-dur-m');
  const setDurP = document.getElementById('set-dur-p');
  const setDurVal = document.getElementById('set-dur-val');
  if (setDurM) setDurM.addEventListener('click', function(){
    SETTINGS.defaultDuration = Math.max(5, SETTINGS.defaultDuration-5);
    if(setDurVal) setDurVal.textContent = SETTINGS.defaultDuration; 
    saveSettings();
  });
  if (setDurP) setDurP.addEventListener('click', function(){
    SETTINGS.defaultDuration = Math.min(90, SETTINGS.defaultDuration+5);
    if(setDurVal) setDurVal.textContent = SETTINGS.defaultDuration; 
    saveSettings();
  });

  const toggleSound = document.getElementById('toggle-sound');
  if (toggleSound) toggleSound.addEventListener('click', function(){
    SETTINGS.sound = !SETTINGS.sound;
    if (SETTINGS.sound) toggleSound.classList.add('on');
    else toggleSound.classList.remove('on');
    saveSettings();
  });

  const btnResetAll = document.getElementById('btn-reset-all');
  if (btnResetAll) {
    let confirmState = false;
    btnResetAll.addEventListener('click', function(){
      if (!confirmState) {
        confirmState = true;
        btnResetAll.textContent = '确定清除吗？再次点击将重置所有数据！';
        btnResetAll.style.color = 'var(--ac)';
        btnResetAll.style.fontWeight = 'bold';
        setTimeout(function(){
          if(btnResetAll) {
            confirmState = false;
            btnResetAll.textContent = '清除所有数据';
            btnResetAll.style.color = '';
            btnResetAll.style.fontWeight = '';
          }
        }, 4000);
      } else {
        Store.del(KEYS.SAVE);
        Store.del(KEYS.SET);
        Store.del(KEYS.STREAK);
        hideSettings();
        doReset();
      }
    });
  }
}

// ─────────────────────────────────────────────
//  Actions Controller
// ─────────────────────────────────────────────
function doLock() {
  S.tasks = S.tasks.map(function(t){ return Object.assign({}, t, {text: t.text.trim()}); });
  S.suggested = suggestTask();
  S.chosen = S.suggested;
  S.phase = 'choose';
  save(); render();
}

function goEdit() {
  clearInterval(_timer);
  S.running = false; S.paused = false;
  S.phase = 'plan';
  render();
}

function advanceAfterReflect() {
  if (S.reflectNext && S.reflectNext.trim()) {
    const empty = S.tasks.findIndex(function(t){ return !t.text.trim(); });
    if (empty >= 0) S.tasks[empty] = {text:S.reflectNext.trim(), energy:'med', skipped:false};
    else S.tasks.push({text:S.reflectNext.trim(), energy:'med', skipped:false});
  }
  const last = S.completedSessions[S.completedSessions.length-1];
  if (last) last.progress = S.reflectProgress;
  S.reflectProgress = ''; S.reflectNext = '';
  S.suggested = suggestTask();
  S.phase = 'choose';
  save(); render();
}

function doReset() {
  clearInterval(_timer);
  _rolloverTasks = [];
  S = newState();
  Store.del(KEYS.SAVE);
  render();
}

// ─────────────────────────────────────────────
//  Keyboard Shortcuts Handler
// ─────────────────────────────────────────────
document.addEventListener('keydown', function(e){
  const activeEl = document.activeElement;
  const tag = activeEl ? activeEl.tagName : null;
  const isInput = tag === 'INPUT' || tag === 'TEXTAREA';

  if (e.key === 'Escape') {
    if (document.getElementById('settings-overlay')) { hideSettings(); return; }
    if (S.phase === 'choose') { S.phase='plan'; render(); return; }
    if (S.phase === 'focus') { clearInterval(_timer); S.running=false; S.phase='plan'; render(); return; }
    if (S.phase === 'reflect') { S.phase='choose'; return; }
  }

  if (isInput) return;

  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (S.phase === 'focus') { S.running ? pauseTimer() : startTimer(); }
  }

  if (e.key === 'Enter') {
    if (S.phase === 'plan') {
      const btn = document.getElementById('btn-lock');
      if (btn && !btn.disabled) { doLock(); }
    }
    if (S.phase === 'choose') {
      const btn = document.getElementById('btn-go');
      if (btn && !btn.disabled) btn.click();
    }
  }

  if (e.key === 'e' || e.key === 'E') {
    if (S.phase !== 'plan') goEdit();
  }

  if (['1','2','3','4','5','6'].indexOf(e.key) !== -1 && S.phase === 'choose') {
    const avail = availableTasks();
    const idx = parseInt(e.key)-1;
    if (avail[idx]) launchFocus(avail[idx].text, avail[idx].energy);
  }
});

// ─────────────────────────────────────────────
//  Initialization entry point
// ─────────────────────────────────────────────
function initApp() {
  loadSettings();
  loadStreak();
  load();
  render();
  if (S.phase === 'focus' && S.timeLeft > 0) { 
    S.paused = true; 
    render(); 
  }
}

// Start app
initApp();
