<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Launchpad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Default: Follow System ── */
:root{
  --bg:#F6F4EF;--surf:#FFF;--surf2:#F0EDE6;--surf3:#E6E3DA;--hover:#EAE7DF;
  --bd:rgba(0,0,0,.07);--bd2:rgba(0,0,0,.12);
  --tx:#18160D;--tx2:#68634F;--tx3:#ABA89B;
  --ac:#C96442;--ac-dim:#F5E8E2;--ac-bd:#E5BCA8;--ac-hover:#B35839;
  --ac-shadow:rgba(201,100,66,.28);
  --green:#277A4A;--green-dim:#E5F2EA;
  --amber:#8A5E05;--amber-dim:#FDF0D5;
  --red:#C03B2B;--red-dim:#FAEAE8;
  --r:14px;--rs:9px;--rp:100px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#131109;--surf:#1B1A15;--surf2:#22211B;--surf3:#2A2920;--hover:#2E2C24;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --tx:#EDE9DE;--tx2:#87846C;--tx3:#4A4840;
  --ac:#D97358;--ac-dim:#231913;--ac-bd:#3E2317;--ac-hover:#E8845E;
  --ac-shadow:rgba(217,115,88,.3);
  --green:#4ABF78;--green-dim:#112119;
  --amber:#E8B040;--amber-dim:#1F1707;
  --red:#E85A4F;--red-dim:#261009;
}}

body{
  font-family:'DM Sans',-apple-system,sans-serif;
  background:var(--bg);color:var(--tx);
  min-height:100vh;
  padding:2rem 1rem 6rem;font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s;
}

/* ── Responsive Layout ── */
.layout-wrapper {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  gap: 2rem;
  align-items: flex-start;
  justify-content: center;
}
.app{width:100%;max-width:480px;position:relative;flex-shrink:0;}
.desktop-sidebar {display:none;} /* Hidden on mobile */

@media (min-width: 900px) {
  .layout-wrapper {max-width: 860px; justify-content: space-between;}
  .desktop-sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 320px;
    flex-shrink: 0;
    margin-top: 3.5rem; /* Align slightly lower to match header */
  }
}

/* ── Overlay ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeOv .15s ease;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
@keyframes fadeOv{from{opacity:0}to{opacity:1}}
.overlay-panel{background:var(--surf);border-radius:var(--r) var(--r) 0 0;
  width:100%;max-width:480px;padding:1.5rem;
  animation:slideUp .22s cubic-bezier(.32,.72,0,1);max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(48px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem}
.header-left{display:flex;align-items:center;gap:9px}
.logo-mark{
  width:30px;height:30px;background:var(--ac);border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 8px var(--ac-shadow);transition:background .3s,box-shadow .3s;
}
.logo-mark svg{width:14px;height:14px;fill:rgba(255,255,255,.95)}
.logo-name{font-size:14px;font-weight:500;color:var(--tx2);letter-spacing:-.01em}
.header-right{display:flex;align-items:center;gap:5px}
.hbtn{width:33px;height:33px;border-radius:var(--rs);background:var(--surf2);
  border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;color:var(--tx2)}
.hbtn:hover{background:var(--hover);color:var(--tx)}
.hbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.streak-badge{display:flex;align-items:center;gap:4px;padding:4px 10px;
  background:var(--amber-dim);border:1px solid color-mix(in srgb,var(--amber) 20%,transparent);
  border-radius:var(--rp);font-size:12px;font-weight:600;color:var(--amber)}

/* ── Phase strip ── */
.phase-strip{display:flex;align-items:center;gap:6px;margin-bottom:1.75rem}
.ph-node{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3);transition:color .25s}
.ph-node.active{color:var(--ac);font-weight:500}
.ph-node.done{color:var(--green)}
.ph-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.ph-line{flex:1;height:1px;background:var(--bd)}

/* ── Greeting ── */
.greeting-card{
  background:linear-gradient(135deg,var(--ac-dim) 0%,var(--surf) 60%);
  border:1px solid var(--ac-bd);border-radius:var(--r);
  padding:1.125rem 1.375rem;margin-bottom:10px;
  display:flex;align-items:flex-start;gap:12px;transition:background .3s,border-color .3s;
}
.greeting-icon{font-size:22px;flex-shrink:0;line-height:1.3}
.greeting-title{font-size:16px;font-weight:600;letter-spacing:-.02em;color:var(--tx);margin-bottom:2px}
.greeting-sub{font-size:13px;color:var(--tx2);line-height:1.5}
.greeting-sub strong{color:var(--ac);font-weight:500}

/* ── Cards ── */
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.06);
  margin-bottom:10px;overflow:hidden;transition:background .3s,border-color .3s}
.card-pad{padding:1.5rem}
.card-foot{padding:0 1.5rem 1.5rem;display:flex;gap:8px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin-bottom:.875rem}
.subtext{font-size:13px;color:var(--tx3);line-height:1.6;margin-bottom:1.25rem}
.hr{height:1px;background:var(--bd);margin:1.25rem 0}

/* ── Rollover banner ── */
.rollover-banner{display:flex;align-items:flex-start;gap:10px;
  background:var(--amber-dim);border:1px solid color-mix(in srgb,var(--amber) 22%,transparent);
  border-radius:var(--r);padding:12px 14px;margin-bottom:10px;animation:fadeUp .2s ease}
.rbtn{padding:5px 10px;border-radius:var(--rs);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid}
.rbtn.primary{background:var(--amber);border-color:var(--amber);color:#fff}
.rbtn.primary:hover{filter:brightness(1.08)}
.rbtn.ghost{background:transparent;border-color:var(--bd2);color:var(--tx2)}
.rbtn.ghost:hover{background:var(--hover)}

/* ── Task count ── */
.task-count-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.125rem}
.task-count-label{font-size:13px;color:var(--tx2)}
.task-count-ctrl{display:flex;align-items:center;gap:8px}
.count-btn{width:26px;height:26px;border-radius:50%;background:var(--surf2);border:1px solid var(--bd);
  cursor:pointer;font-size:16px;color:var(--tx2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.count-btn:hover{background:var(--hover)}
.count-btn:disabled{opacity:.3;cursor:not-allowed}
.count-val{font-size:15px;font-weight:600;color:var(--tx);min-width:18px;text-align:center}

/* ── Task rows ── */
.task-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.task-row-wrap{display:flex;align-items:stretch;border:1px solid var(--bd);border-radius:var(--rs);
  background:var(--surf2);transition:all .2s;overflow:hidden}
.task-row-wrap:focus-within{border-color:var(--ac-bd);background:var(--surf);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent)}
.energy-btn{width:36px;flex-shrink:0;border:none;background:transparent;
  border-right:1px solid var(--bd);cursor:pointer;font-size:14px;transition:background .15s;
  display:flex;align-items:center;justify-content:center}
.energy-btn:hover{background:var(--hover)}
.task-field{flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;min-height:46px}
.task-num{font-size:11px;font-weight:500;color:var(--tx3);flex-shrink:0;min-width:14px}
.task-inp{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;color:var(--tx);outline:none;padding:10px 0;width:100%}
.task-inp::placeholder{color:var(--tx3)}
.task-inp:disabled{opacity:.5;cursor:not-allowed}
.del-btn{width:30px;height:30px;flex-shrink:0;border:none;background:transparent;cursor:pointer;
  color:var(--tx3);display:flex;align-items:center;justify-content:center;border-radius:5px;transition:all .15s;margin-right:4px}
.del-btn:hover{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac)}
.del-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* ── Buttons ── */
.btn-main{width:100%;padding:12px 16px;background:var(--ac);color:#fff;border:none;
  border-radius:var(--rs);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;
  transition:all .2s;letter-spacing:-.01em;box-shadow:0 1px 4px var(--ac-shadow)}
.btn-main:hover:not(:disabled){background:var(--ac-hover);box-shadow:0 2px 12px var(--ac-shadow)}
.btn-main:active:not(:disabled){transform:scale(.98)}
.btn-main:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-sec{padding:11px 16px;background:var(--surf2);color:var(--tx2);border:1px solid var(--bd);
  border-radius:var(--rs);font-family:inherit;font-size:14px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sec:hover{background:var(--hover);color:var(--tx)}
.btn-ghost{background:none;border:none;font-family:inherit;font-size:13px;color:var(--tx3);
  cursor:pointer;padding:8px 10px;transition:all .15s;border-radius:var(--rs)}
.btn-ghost:hover{color:var(--tx2);background:var(--hover)}

/* ── Choose phase ── */
.sugg-card{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--ac-bd);
  border-radius:var(--rs);padding:14px 16px;background:var(--ac-dim);margin-bottom:8px;
  cursor:pointer;transition:all .15s;width:100%;font-family:inherit;text-align:left}
.sugg-card:hover{border-color:var(--ac);box-shadow:0 2px 12px var(--ac-shadow)}
.sugg-badge{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:var(--rp);
  padding:2px 7px;flex-shrink:0;margin-top:3px}
.sugg-text{font-size:14px;color:var(--tx);line-height:1.5;font-weight:500}
.other-tasks{display:flex;flex-direction:column;gap:4px;margin-bottom:1.25rem}
.other-btn{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--surf2);
  border:1px solid var(--bd);border-radius:var(--rs);font-family:inherit;text-align:left;
  cursor:pointer;transition:all .15s;width:100%;color:var(--tx2);font-size:13px}
.other-btn:hover{background:var(--hover);border-color:var(--bd2);color:var(--tx)}
.other-btn-num{color:var(--tx3);font-size:11px;margin-top:2px;flex-shrink:0}
.skip-tag{font-size:10px;color:var(--tx3);background:var(--surf3);border-radius:var(--rp);
  padding:2px 7px;margin-left:auto;flex-shrink:0;transition:all .15s}
.skip-tag:hover{background:var(--ac-dim);color:var(--ac)}

/* ── Duration ── */
.dur-row{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.dur-adj{width:28px;height:28px;border-radius:50%;background:var(--surf2);border:1px solid var(--bd);
  cursor:pointer;font-size:17px;color:var(--tx2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.dur-adj:hover{background:var(--hover)}
.dur-val{font-size:20px;font-weight:500;letter-spacing:-.02em;min-width:32px;text-align:center}
.dur-unit{font-size:13px;color:var(--tx3)}
.dur-mode-tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--rp);
  background:var(--surf2);color:var(--tx3);border:1px solid var(--bd);margin-left:2px}

/* ── Progress pills ── */
.progress-pills{display:flex;gap:5px;margin-bottom:1.5rem}
.prog-pill{flex:1;padding:5px 8px;border-radius:var(--rp);font-size:11px;text-align:center;
  border:1px solid var(--bd);color:var(--tx3);background:var(--surf2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s}
.prog-pill.active{background:var(--ac-dim);border-color:var(--ac-bd);color:var(--ac);font-weight:500}
.prog-pill.done{background:var(--green-dim);border-color:transparent;color:var(--green);text-decoration:line-through}
.prog-pill.skip{opacity:.35;text-decoration:line-through}

/* ── Timer ── */
.timer-wrap{padding:2rem 1.5rem 1.75rem;text-align:center}
.focus-task-label{display:inline-flex;align-items:center;gap:6px;background:var(--surf2);
  border:1px solid var(--bd);border-radius:var(--rp);padding:5px 14px;font-size:13px;
  color:var(--tx2);margin-bottom:1.75rem;max-width:100%;overflow:hidden}
.focus-task-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx);font-weight:500}
.ring-wrap{position:relative;width:180px;height:180px;margin:0 auto 1.75rem}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surf3);stroke-width:3}
.ring-fg{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-time{font-size:38px;font-weight:300;letter-spacing:-.04em;line-height:1}
.ring-status{font-size:11px;color:var(--tx3);margin-top:5px;letter-spacing:.04em;text-transform:uppercase}
.timer-actions{display:flex;align-items:center;justify-content:center;gap:12px;position:relative}
.play-btn{width:52px;height:52px;border-radius:50%;background:var(--ac);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;
  box-shadow:0 3px 14px var(--ac-shadow)}
.play-btn:hover{background:var(--ac-hover);box-shadow:0 5px 20px var(--ac-shadow);transform:scale(1.05)}
.play-btn:active{transform:scale(.95)}
.play-btn svg{width:18px;height:18px;fill:#fff}
.play-btn.is-play svg{margin-left:2px}

/* ── Review: Pillars ── */
.pillar-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:1.75rem}
.pillar-row{display:flex;align-items:center;gap:10px}
.pillar-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.pillar-label{width:78px;font-size:13px;color:var(--tx2);flex-shrink:0}
.slider-wrap{flex:1}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;
  outline:none;cursor:pointer;
  --fp:50%;--fc:var(--amber);
  background:linear-gradient(to right,var(--fc) 0%,var(--fc) var(--fp),var(--surf3) var(--fp),var(--surf3) 100%);
  transition:background .1s}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;
  border-radius:50%;background:var(--surf);border:2px solid var(--fc);
  cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:border-color .1s,transform .1s}
.slider:hover::-webkit-slider-thumb{transform:scale(1.15)}
.slider::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--surf);
  border:2px solid var(--fc);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.slider::-webkit-slider-runnable-track{height:5px;border-radius:3px}
.pillar-val-wrap{width:22px;text-align:center;flex-shrink:0}
.pillar-val{font-size:13px;font-weight:600;color:var(--tx)}
.pillars-total{text-align:right;font-size:13px;color:var(--tx2);margin-bottom:1.5rem;margin-top:-4px}
.pillars-total strong{color:var(--tx);font-weight:600}

/* ── Review: Zone cards ── */
.zone-cards{display:flex;flex-direction:column;gap:7px;margin-bottom:1.5rem}
.zone-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--rs);
  border:1.5px solid var(--bd);background:var(--surf2);cursor:pointer;text-align:left;
  transition:all .18s;position:relative;overflow:hidden}
.zone-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;transition:width .18s}
.zone-card.z-comfort::before{background:var(--green)}
.zone-card.z-stretch::before{background:var(--amber)}
.zone-card.z-panic::before{background:var(--red)}
.zone-card:hover{background:var(--hover);border-color:var(--bd2)}
.zone-card.z-comfort.sel{background:var(--green-dim);border-color:var(--green)}
.zone-card.z-stretch.sel{background:var(--amber-dim);border-color:var(--amber)}
.zone-card.z-panic.sel{background:var(--red-dim);border-color:var(--red)}
.zone-icon{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.zone-body{flex:1}
.zone-title{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.2;color:var(--tx)}
.zone-card.z-comfort.sel .zone-title{color:var(--green)}
.zone-card.z-stretch.sel .zone-title{color:var(--amber)}
.zone-card.z-panic.sel .zone-title{color:var(--red)}
.zone-desc{font-size:12px;color:var(--tx3);margin-top:1px}
.zone-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--bd2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s}
.zone-card.z-comfort.sel .zone-check{background:var(--green);border-color:var(--green)}
.zone-card.z-stretch.sel .zone-check{background:var(--amber);border-color:var(--amber)}
.zone-card.z-panic.sel .zone-check{background:var(--red);border-color:var(--red)}
.zone-check svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s}
.zone-card.sel .zone-check svg{opacity:1}

/* ── Review: Tomorrow ── */
.tom-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.tom-row{display:flex;align-items:center;border:1px solid var(--bd);border-radius:var(--rs);
  background:var(--surf2);transition:all .15s;overflow:hidden}
.tom-row:focus-within{border-color:var(--ac-bd);background:var(--surf);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 12%,transparent)}
.tom-idx{font-size:11px;font-weight:500;color:var(--tx3);padding:0 10px;flex-shrink:0}
.tom-inp{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;color:var(--tx);outline:none;padding:10px 10px 10px 0}
.tom-inp::placeholder{color:var(--tx3)}

/* ── Summary & Sidebar Widgets ── */
.confetti-piece{position:absolute;top:0;animation:confettiDrop var(--dur,1.4s) ease-out var(--delay,0s) forwards}
@keyframes confettiDrop{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(220px) rotate(450deg);opacity:0}}
.score-ring-wrap{position:relative;width:140px;height:140px;margin:0 auto 1.25rem}
.score-ring-wrap svg{transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:var(--surf3);stroke-width:8}
.score-ring-fg{fill:none;stroke:var(--ac);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.3,1),stroke .3s}
.score-ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-big{font-size:30px;font-weight:300;letter-spacing:-.03em;line-height:1}
.score-max{font-size:12px;color:var(--tx3)}
.stat-row{display:flex;gap:8px;margin-bottom:1.25rem}
.stat-box{flex:1;padding:12px;background:var(--surf2);border:1px solid var(--bd);border-radius:var(--rs);text-align:center}
.stat-val{font-size:20px;font-weight:500;letter-spacing:-.02em;color:var(--tx)}
.stat-label{font-size:11px;color:var(--tx3);margin-top:2px}

/* ── Desktop Dashboard Widgets ── */
.widget {
  background: var(--surf); border: 1px solid var(--bd); border-radius: var(--r);
  padding: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.04);
  transition: background .3s, border-color .3s;
}
.widget-title { font-size: 13px; font-weight: 600; color: var(--tx); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.brain-dump-inp {
  width: 100%; height: 110px; border: 1px solid var(--bd); border-radius: var(--rs);
  background: var(--surf2); padding: 12px; font-family: inherit; font-size: 13.5px;
  color: var(--tx); resize: none; outline: none; transition: all .2s; line-height: 1.5;
}
.brain-dump-inp::placeholder { color: var(--tx3); }
.brain-dump-inp:focus { border-color: var(--ac-bd); background: var(--surf); box-shadow: 0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent); }

/* SVG Chart Logic */
.chart-wrap{margin:0 0 1.25rem;padding:1rem;background:var(--surf2);border-radius:var(--rs);border:1px solid var(--bd)}
.chart-svg{width:100%;overflow:visible}
.chart-area{fill:url(#chartGrad);opacity:.2}
.chart-line{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.chart-point{fill:var(--surf);stroke:var(--ac);stroke-width:2.5;transition:stroke .3s}
.chart-label{font-size:9.5px;fill:var(--tx3);text-anchor:middle}
.chart-val-text{font-size:10px;fill:var(--tx2);font-weight:600;text-anchor:middle}

.hist-item{padding:14px 0;border-bottom:1px solid var(--bd)}
.hist-item:last-child{border:none}
.hist-date{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.hist-score-badge{font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--rp);background:var(--ac-dim);color:var(--ac)}
.hist-task{font-size:13px;color:var(--tx2);margin-bottom:3px;display:flex;align-items:flex-start;gap:6px}
.hist-task::before{content:'·';color:var(--tx3);font-weight:700}
.hist-zone-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-top:6px}

/* ── Settings ── */
.settings-title{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between}
.settings-section-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px;margin-top:1.25rem}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--bd)}
.settings-row:last-of-type{border:none}
.settings-label{font-size:14px;color:var(--tx)}
.settings-sub{font-size:12px;color:var(--tx3);margin-top:1px}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--surf3);border:1px solid var(--bd2);cursor:pointer;position:relative;transition:all .2s;flex-shrink:0}
.toggle.on{background:var(--ac);border-color:var(--ac)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(18px)}

/* ── Theme picker ── */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-bottom:4px}
.theme-swatch{
  position:relative;height:62px;border-radius:10px;border:2px solid transparent;
  cursor:pointer;overflow:hidden;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:flex-end;padding:7px 8px;
  transition:transform .15s,box-shadow .15s;font-family:inherit;

.theme-swatch:hover{transform:scale(1.04);box-shadow:0 4px 14px rgba(0,0,0,.15)}

.sw-accent{position:absolute;top:7px;right:7px;width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5)}

.theme-swatch.active .sw-emoji{opacity:0}

.kbd-hint{font-size:11px;color:var(--tx3);text-align:center;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .22s ease both}

/* ─── State ─── */
let SETTINGS = {taskCount:3,defaultDuration:25,sound:true,theme:'system'};
let STREAK = {count:0,lastDate:'',longest:0};
let HIST = [];
let S = newState();
let _timer = null;
let _rolloverTasks = [];

function newState(){
  const n=SETTINGS.taskCount||3;
  return{
    phase:'plan',
    tasks:Array.from({length:n},function(){return{text:'',energy:'med',skipped:false};}),
    suggested:0,chosen:-1,
    duration:SETTINGS.defaultDuration||25,
    timeLeft:0,totalTime:0,running:false,paused:false,
    completedSessions:[],focusTask:'',focusEnergy:'med',
    review:{pillars:{sleep:5,exercise:5,nutrition:5,connection:5,rest:5},zone:'stretch',tomorrow:['']}
  };
}

/* ─── Persistence ─── */
function loadHistory(){const r=Store.get(KEYS.HIST);if(r){try{HIST=JSON.parse(r);}catch(e){}}}
function saveHistory(rec){
  const i=HIST.findIndex(function(h){return h.date===rec.date;});
  if(i>=0)HIST[i]=rec;else HIST.push(rec);
  Store.set(KEYS.HIST,JSON.stringify(HIST));
}
function loadSettings(){
  const r=Store.get(KEYS.SET);
  if(r){try{SETTINGS=Object.assign({},SETTINGS,JSON.parse(r));}catch(e){}}
}
function saveSettings(){Store.set(KEYS.SET,JSON.stringify(SETTINGS));}
function loadStreak(){const r=Store.get(KEYS.STREAK);if(r){try{STREAK=Object.assign({},STREAK,JSON.parse(r));}catch(e){}}}
function saveStreak(){Store.set(KEYS.STREAK,JSON.stringify(STREAK));}
function recordStreakDay(){
  const today=new Date().toDateString();
  if(STREAK.lastDate===today)return;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  STREAK.count=STREAK.lastDate===yesterday?STREAK.count+1:1;
  STREAK.longest=Math.max(STREAK.longest,STREAK.count);
  STREAK.lastDate=today;saveStreak();
}
function load(){
  loadHistory();
  const raw=Store.get(KEYS.SAVE);
  if(!raw)return;
  try{
    const parsed=JSON.parse(raw);
    const today=new Date().toDateString();
    if(parsed.date===today){
      S=Object.assign({},newState(),parsed.state,{running:false});
      S.completedSessions=S.completedSessions||[];
      S.tasks=S.tasks||[];
      S.review=S.review||newState().review;
    } else {
      const tasks=parsed.state.tasks||[];
      const past=parsed.state.completedSessions||[];
      _rolloverTasks=tasks.filter(function(t){
        return t.text&&t.text.trim()&&!past.find(function(s){return s.task===t.text;});
      });
      const last=HIST.length>0?HIST[HIST.length-1]:null;
      if(last&&last.tomorrow&&last.tomorrow.length>0){
        const toms=last.tomorrow.filter(function(t){return t.trim();});
        if(toms.length>0){
          S.tasks=toms.map(function(t){return{text:t,energy:'med',skipped:false};});
          while(S.tasks.length<SETTINGS.taskCount)S.tasks.push({text:'',energy:'med',skipped:false});
        }
      }
    }
  }catch(e){console.error(e);}
}
function save(){
  Store.set(KEYS.SAVE,JSON.stringify({date:new Date().toDateString(),state:Object.assign({},S,{running:false})}));
}

/* ─── Audio ─── */
function playDone(){
  if(!SETTINGS.sound)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    const ctx=new Ctx();
    [[880,.05],[660,.3],[440,.65]].forEach(function(p){
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.type='sine';osc.frequency.value=p[0];
      const t=ctx.currentTime+p[1];
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(0.22,t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001,t+1.2);
      osc.start(t);osc.stop(t+1.2);
    });
  }catch(e){}
}

/* ─── Helpers ─── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function fmtDate(){return new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});}
function durMode(d){return d<=15?'热身':d<=30?'番茄':d<=50?'深度':'马拉松';}
function availableTasks(){
  return S.tasks.map(function(t,i){return Object.assign({},t,{i:i});}).filter(function(t){
    return t.text.trim()&&!t.skipped&&!S.completedSessions.find(function(s){return s.task===t.text;});
  });
}
function suggestTask(){
  const h=new Date().getHours();
  const order=h<13?['high','med','low']:h<17?['med','high','low']:['low','med','high'];
  const avail=availableTasks();
  for(let i=0;i<order.length;i++){const t=avail.find(function(t){return t.energy===order[i];});if(t)return t.i;}
  return avail.length>0?avail[0].i:0;
}
function hasMore(){return availableTasks().length>0;}
function pillarsTotal(){const p=S.review.pillars;return Object.keys(p).reduce(function(a,k){return a+(p[k]||0);},0);}
function getGreeting(){
  const h=new Date().getHours();
  if(h>=5&&h<11)return{icon:'☀️',title:'早上好',sub:'写下今天最重要的事情。'};
  if(h>=11&&h<14)return{icon:'🌤',title:'上午好',sub:'趁精力还在，锁定今天的计划。'};
  if(h>=14&&h<18)return{icon:'⛅',title:'下午好',sub:'下午也是好的开始。'};
  if(h>=18&&h<22)return{icon:'🌆',title:'傍晚好',sub:'这会儿适合收尾或做轻松任务。'};
  return{icon:'🌙',title:'晚上好',sub:'为明天的早晨做好准备。'};
}
function sliderFillCSS(val){
  const pct=(val/10*100).toFixed(1)+'%';
  const col=val<=3?'var(--red)':val<=6?'var(--amber)':'var(--green)';
  return '--fp:'+pct+';--fc:'+col;
}
// Shared Chart Generator
function generateChartHTML(chartData, w=400, h=90) {
  if(!chartData || chartData.length < 2) return '<p style="text-align:center;color:var(--tx3);font-size:12px;padding:1.5rem 0">积累几天后显示走势图</p>';
  const pX=28, pY=16;
  const dx=(w-pX*2)/(chartData.length-1);
  const pts=chartData.map(function(d,i){return{x:pX+i*dx,y:pY+(50-d.v)/50*(h-pY*2),v:d.v,l:d.d};});
  const aPath='M'+pts[0].x+','+h+' '+pts.map(function(p){return p.x+','+p.y;}).join(' L')+' L'+pts[pts.length-1].x+','+h+' Z';
  return '<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'">'
    +'<defs><linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="var(--ac)" stop-opacity=".5"/>'
    +'<stop offset="100%" stop-color="var(--ac)" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<path class="chart-area" d="'+aPath+'"/>'
    +'<polyline class="chart-line" points="'+pts.map(function(p){return p.x+','+p.y;}).join(' ')+'"/>'
    +pts.map(function(p){
      return'<circle class="chart-point" cx="'+p.x+'" cy="'+p.y+'" r="3.5"/>'
        +'<text class="chart-val-text" x="'+p.x+'" y="'+(p.y-9)+'">'+p.v+'</text>'
        +'<text class="chart-label" x="'+p.x+'" y="'+(h-1)+'">'+p.l+'</text>';
    }).join('')+'</svg>';
}

/* ─── Timer ─── */
function startTimer(){
  clearInterval(_timer);S.running=true;S.paused=false;
  _timer=setInterval(function(){
    if(!S.running)return;
    if(S.timeLeft<=0){clearInterval(_timer);S.running=false;playDone();finishSession();return;}
    S.timeLeft--;
    const rt=document.getElementById('ring-time');
    const rf=document.getElementById('ring-fg');
    const rs=document.getElementById('ring-status');
    if(rt)rt.textContent=fmt(S.timeLeft);
    if(rf)rf.style.strokeDashoffset=String(C*(1-S.timeLeft/S.totalTime));
    if(rs)rs.textContent='专注中';
    if(S.timeLeft%30===0)save();
  },1000);
  renderAppContent();
}
function pauseTimer(){clearInterval(_timer);S.running=false;S.paused=true;renderAppContent();}
function finishSession(){
  S.completedSessions.push({task:S.focusTask,duration:S.duration,progress:''});
  S.suggested=suggestTask();
  S.phase=hasMore()?'choose':'review';
  save();render();
}
function launchFocus(text,energy){
  S.focusTask=text;S.focusEnergy=energy||'med';
  S.timeLeft=S.duration*60;S.totalTime=S.duration*60;
  S.running=false;S.paused=false;S.phase='focus';save();render();
}

function renderPhase(active){
  const phases=[{id:'plan',l:'计划'},{id:'focus',l:'专注'},{id:'review',l:'复盘'}];
  const ai=phases.findIndex(function(p){return p.id===active;});
  return '<div class="phase-strip">'+phases.map(function(p,i){
    const cls=i<ai?'done':i===ai?'active':'';
    return(i>0?'<div class="ph-line"></div>':'')+'<div class="ph-node '+cls+'"><div class="ph-dot"></div>'+p.l+'</div>';
  }).join('')+'</div>';

function renderProgressPills(){

    +chartHTML
    +'</div>'
    +'</div><div class="card-foot"><button class="btn-main" id="btn-reset">重置，明天见</button></div></div>';
}

/* ─── Desktop Sidebar Renderer ─── */
function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  
  const notes = Store.get(KEYS.NOTES) || '';
  
  // Calculate lifetime totals
  const totalMin = HIST.reduce(function(a,h){return a+((h.sessions||[]).reduce(function(sa,s){return sa+(s.duration||0);},0));},0) 
                 + S.completedSessions.reduce(function(a,s){return a+(s.duration||0);},0);
  
  // Recent trend chart for Sidebar
  let chartData = HIST.slice(-6).map(function(h){ return {d: h.date.substring(4,10), v: h.total||0}; });
  if (S.phase === 'summary' || S.phase === 'review') {
      chartData.push({ d: '今天', v: pillarsTotal() });
  } else if (HIST.length === 0) {
      chartData = []; // Don't show chart if no history
  }

  sidebar.innerHTML = `
    <!-- Brain Dump Widget -->
    <div class="widget fu" style="animation-delay: 0.05s;">
      <div class="widget-title">💡 闪念笔记 (Brain Dump)</div>
      <p style="font-size:12px; color:var(--tx3); margin-bottom:12px; line-height:1.5;">
        专注时突然想到的杂事写在这里，清空大脑，继续专注。
      </p>
      <textarea class="brain-dump-inp" id="brain-dump-inp" placeholder="例如：记得回复邮件、去超市买牛奶...">${esc(notes)}</textarea>
    </div>

    <!-- Chart Widget -->
    <div class="widget fu" style="animation-delay: 0.15s; padding:1.25rem 1rem;">
      <div class="widget-title" style="padding-left:0.25rem;">📊 状态趋势</div>
      ${generateChartHTML(chartData, 280, 80)}
    </div>

    <!-- Milestones Widget -->
    <div class="widget fu" style="animation-delay: 0.25s;">
      <div class="widget-title">🏆 里程碑</div>
      <div style="display:flex; gap:10px;">
        <div style="flex:1; background:var(--surf2); padding:12px 10px; border-radius:var(--rs); text-align:center;">
          <div style="font-size:20px; font-weight:600; color:var(--tx);">${STREAK.count}</div>
          <div style="font-size:11px; color:var(--tx3); margin-top:2px;">当前连续 (天)</div>
        </div>
        <div style="flex:1; background:var(--surf2); padding:12px 10px; border-radius:var(--rs); text-align:center;">
          <div style="font-size:20px; font-weight:600; color:var(--tx);">${totalMin}</div>
          <div style="font-size:11px; color:var(--tx3); margin-top:2px;">累计专注 (分钟)</div>
        </div>
      </div>
    </div>
  `;

  // Bind Brain Dump autosave
  const bd = document.getElementById('brain-dump-inp');
  if(bd) {
    bd.addEventListener('input', function(e) {
      Store.set(KEYS.NOTES, e.target.value);
    });
  }
}

/* ─── Settings & History Overlays ─── */
function renderSettingsOverlay(){
  const cur=SETTINGS.theme||'system';
  const themeSwatches=Object.keys(THEMES).map(function(key){
    const t=THEMES[key];
    const active=key===cur?' active':'';
    const isGrad=t.swBg.indexOf('gradient')>=0;
    const bgStyle=isGrad?'background:'+t.swBg:'background-color:'+t.swBg;
    const acDot=t.swAc&&t.swAc!=='transparent'?'<div class="sw-accent" style="background:'+t.swAc+'"></div>':'';
    return'<button class="theme-swatch'+active+'" data-theme="'+key+'" style="'+bgStyle+'">'
      +acDot+'<span class="sw-emoji">'+t.emoji+'</span><span class="sw-name">'+t.name+'</span></button>';
  }).join('');

  return'<div class="overlay" id="set-ov"><div class="overlay-panel">'
    +'<div class="settings-title">设置<button class="btn-ghost" id="close-set">✕</button></div>'
    +'<div class="settings-section-label" style="margin-top:0">外观主题</div>'
    +'<div class="theme-grid">'+themeSwatches+'</div>'
    +'<div class="settings-section-label">偏好</div>'
    +'<div class="settings-row"><div><div class="settings-label">默认任务数</div><div class="settings-sub">新一天重置后的初始行数</div></div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button class="dur-adj" id="st-tc-m">−</button>'
    +'<span style="font-size:16px;font-weight:500;min-width:20px;text-align:center" id="st-tc">'+SETTINGS.taskCount+'</span>'
    +'<button class="dur-adj" id="st-tc-p">+</button>'
    +'</div></div>'
    +'<div class="settings-row"><div><div class="settings-label">默认专注时长</div><div class="settings-sub">分钟</div></div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button class="dur-adj" id="st-dur-m">−</button>'
    +'<span style="font-size:16px;font-weight:500;min-width:28px;text-align:center" id="st-dur">'+SETTINGS.defaultDuration+'</span>'
    +'<button class="dur-adj" id="st-dur-p">+</button>'
    +'</div></div>'
    +'<div class="settings-row"><div><div class="settings-label">计时结束提示音</div></div>'
    +'<button class="toggle '+(SETTINGS.sound?'on':'')+'" id="st-sound"></button></div>'
    +'<div class="settings-section-label">键盘快捷键</div>'
    +'<div class="kbd-grid" style="padding:4px 0 12px">'
    +'<span><kbd>Enter</kbd> 确认/锁定</span><span><kbd>Space</kbd> 暂停/继续</span>'
    +'<span><kbd>Esc</kbd> 返回/编辑</span><span><kbd>1 2 3</kbd> 选任务</span>'
    +'</div>'
    +'<button class="btn-ghost" id="st-reset-all" style="color:color-mix(in srgb,var(--ac) 80%,transparent);font-size:13px;width:100%;text-align:left;margin-top:4px">清除所有本地数据</button>'
    +'</div></div>';
}

function renderHistoryOverlay(){
  if(!HIST.length){
    return'<div class="overlay" id="hist-ov"><div class="overlay-panel">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">'
      +'<h3 style="font-size:16px;font-weight:600">历史记录</h3>'
      +'<button class="btn-ghost" id="close-hist">✕</button></div>'
      +'<p style="color:var(--tx3);text-align:center;padding:2rem 0">完成今天的复盘后记录会显示在这里</p>'
      +'</div></div>';
  }
  const zoneCol=function(z){return z==='comfort'?'var(--green)':z==='stretch'?'var(--amber)':'var(--red)';};
  const zoneBg=function(z){return z==='comfort'?'var(--green-dim)':z==='stretch'?'var(--amber-dim)':'var(--red-dim)';};
  const zoneLabel=function(z){return z==='comfort'?'😌 舒适区':z==='stretch'?'💪 成长区':'😰 紧张区';};
  const histHTML=HIST.slice().reverse().map(function(h){
    return'<div class="hist-item">'
      +'<div class="hist-date"><span>'+esc(h.date)+'</span><span class="hist-score-badge">'+h.total+'/50</span></div>'
      +(h.sessions||[]).map(function(s){return'<div class="hist-task">'+esc(s.task)+'</div>';}).join('')
      +(h.zone?'<div class="hist-zone-tag" style="color:'+zoneCol(h.zone)+';background:'+zoneBg(h.zone)+'">'+zoneLabel(h.zone)+'</div>':'')
      +'</div>';
  }).join('');
  return'<div class="overlay" id="hist-ov"><div class="overlay-panel">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">'
    +'<h3 style="font-size:16px;font-weight:600">📖 历史记录</h3>'
    +'<button class="btn-ghost" id="close-hist">✕</button></div>'
    +'<div style="max-height:62vh;overflow-y:auto;margin-bottom:1rem;padding-right:6px">'+histHTML+'</div>'
    +'<button class="btn-ghost" id="clear-hist" style="width:100%;color:var(--red);font-size:13px">清空历史记录</button>'
    +'</div></div>';
}

/* ─── Render Orchestrator ─── */
function renderAppContent() {
  const app=document.getElementById('app');
  if(!app)return;
  if(S.phase==='plan')        app.innerHTML=renderPlan();
  else if(S.phase==='choose') app.innerHTML=renderChoose();
  else if(S.phase==='focus')  app.innerHTML=renderFocus();
  else if(S.phase==='review') app.innerHTML=renderReview();
  else if(S.phase==='summary')app.innerHTML=renderSummary();
  bindEvents();
}

function render(){
  renderAppContent();
  renderSidebar(); // Update the sidebar whenever main view updates
}

function showOverlay(html,bindFn){const root=document.getElementById('overlay-root');if(root){root.innerHTML=html;if(bindFn)bindFn();}}
function hideOverlay(){const root=document.getElementById('overlay-root');if(root)root.innerHTML='';}

/* ─── Event helpers ─── */
function q(id,fn){const el=document.getElementById(id);if(el)el.addEventListener('click',fn);}

/* ─── Event binding ─── */
function bindEvents(){
  q('hdr-settings',function(){showOverlay(renderSettingsOverlay(),bindSettings);});
  q('hdr-edit',goEdit);
  q('btn-hist',function(){showOverlay(renderHistoryOverlay(),bindHistory);});
  
  q('rollover-add',function(){
    _rolloverTasks.forEach(function(rt){
      const empty=S.tasks.findIndex(function(t){return!t.text.trim();});
      if(empty>=0)S.tasks[empty]={text:rt.text,energy:rt.energy||'med',skipped:false};
      else S.tasks.push({text:rt.text,energy:rt.energy||'med',skipped:false});
    });
    _rolloverTasks=[];save();render();
  });
  q('rollover-skip',function(){_rolloverTasks=[];render();});
  
  q('cnt-m',function(){if(S.tasks.length>1){S.tasks.pop();render();}});
  q('cnt-p',function(){if(S.tasks.length<6){S.tasks.push({text:'',energy:'med',skipped:false});render();}});
  
  S.tasks.forEach(function(_,i){
    const inp=document.getElementById('tinp-'+i);
    if(inp)inp.addEventListener('input',function(e){
      S.tasks[i].text=e.target.value;
      const btn=document.getElementById('btn-lock');
      if(btn)btn.disabled=!S.tasks.some(function(t){return t.text.trim();});
    });
    q('ebtn-'+i,function(){
      const idx=ENERGY.findIndex(function(e){return e.k===S.tasks[i].energy;});
      S.tasks[i].energy=ENERGY[(idx+1)%ENERGY.length].k;
      const btn=document.getElementById('ebtn-'+i);
      if(btn)btn.textContent=ENERGY[(idx+1)%ENERGY.length].i;
    });
    q('del-'+i,function(){if(S.tasks.length>1){S.tasks.splice(i,1);render();}});
  });
  
  q('btn-lock',doLock);
  q('btn-sugg',function(){const t=S.tasks[S.suggested];if(t)launchFocus(t.text,t.energy);});
  
  availableTasks().filter(function(t){return t.i!==S.suggested;}).forEach(function(t){
    q('other-'+t.i,function(e){
      const sk=document.getElementById('sk-'+t.i);
      if(sk&&(e.target===sk||sk.contains(e.target))){
        S.tasks[t.i].skipped=true;S.suggested=suggestTask();
        if(!hasMore())S.phase='review';save();render();return;
      }
      launchFocus(t.text,t.energy);
    });
  });
  
  q('dur-m',function(){S.duration=Math.max(5,S.duration-5);render();});
  q('dur-p',function(){S.duration=Math.min(90,S.duration+5);render();});
  q('btn-go',function(){const avail=availableTasks();if(avail.length)launchFocus(avail[0].text,avail[0].energy);});
  q('btn-play',function(){S.running?pauseTimer():startTimer();});
  q('btn-end',function(){clearInterval(_timer);S.running=false;finishSession();});
  q('btn-switch',function(){clearInterval(_timer);S.running=false;S.suggested=suggestTask();S.phase='choose';save();render();});

  // Review Events
  PILLARS.forEach(function(item){
    const slider=document.getElementById('pil-'+item.id);
    if(!slider)return;
    slider.addEventListener('input',function(e){
      const val=parseInt(e.target.value);
      S.review.pillars[item.id]=val;
      const valEl=document.getElementById('pil-val-'+item.id);
      if(valEl)valEl.textContent=val;
      e.target.style.cssText=sliderFillCSS(val);
      const tot=document.getElementById('pillars-total');
      if(tot)tot.textContent=pillarsTotal()+'/50';
    });
  });
  ZONES.forEach(function(z){
    q('zone-'+z.id,function(){
      S.review.zone=z.id;
      document.querySelectorAll('.zone-card').forEach(function(el){el.classList.remove('sel');});
      const btn=document.getElementById('zone-'+z.id);
      if(btn)btn.classList.add('sel');
      save();
    });
  });
  document.querySelectorAll('.tom-inp').forEach(function(inp){
    inp.addEventListener('input',function(e){
      S.review.tomorrow[parseInt(e.target.getAttribute('data-idx'))]=e.target.value;
    });
  });
  q('btn-add-tom',function(){
    S.review.tomorrow.push('');
    const container=document.getElementById('tom-tasks');
    if(!container)return;
    const idx=S.review.tomorrow.length-1;
    const div=document.createElement('div');
    div.className='tom-row';
    div.innerHTML='<span class="tom-idx">'+(idx+1)+'</span><input class="tom-inp" data-idx="'+idx+'" placeholder="动作 '+(idx+1)+'…" value="">';
    container.appendChild(div);
    const inp=div.querySelector('.tom-inp');
    if(inp){inp.addEventListener('input',function(e){S.review.tomorrow[parseInt(e.target.getAttribute('data-idx'))]=e.target.value;});inp.focus();}
  });
  
  q('btn-finish-day',function(){
    const total=pillarsTotal();
    saveHistory({date:new Date().toDateString(),sessions:S.completedSessions,
      pillars:Object.assign({},S.review.pillars),total:total,zone:S.review.zone,
      tomorrow:S.review.tomorrow.filter(function(t){return t.trim();})});
    recordStreakDay();S.phase='summary';save();render();
  });
  q('btn-reset',doReset);
}

function bindSettings(){
  q('close-set',hideOverlay);
  q('st-sound',function(){
    SETTINGS.sound=!SETTINGS.sound;
    const btn=document.getElementById('st-sound');
    if(btn)btn.classList.toggle('on',SETTINGS.sound);
    saveSettings();
  });
  const tcEl=document.getElementById('st-tc');
  q('st-tc-m',function(){SETTINGS.taskCount=Math.max(1,SETTINGS.taskCount-1);if(tcEl)tcEl.textContent=SETTINGS.taskCount;saveSettings();});
  q('st-tc-p',function(){SETTINGS.taskCount=Math.min(6,SETTINGS.taskCount+1);if(tcEl)tcEl.textContent=SETTINGS.taskCount;saveSettings();});
  const durEl=document.getElementById('st-dur');
  q('st-dur-m',function(){SETTINGS.defaultDuration=Math.max(5,SETTINGS.defaultDuration-5);if(durEl)durEl.textContent=SETTINGS.defaultDuration;saveSettings();});
  q('st-dur-p',function(){SETTINGS.defaultDuration=Math.min(90,SETTINGS.defaultDuration+5);if(durEl)durEl.textContent=SETTINGS.defaultDuration;saveSettings();});

  document.querySelectorAll('.theme-swatch').forEach(function(swatch){
    swatch.addEventListener('click',function(){
      const key=swatch.getAttribute('data-theme');
      SETTINGS.theme=key; saveSettings(); applyTheme(key);
      document.querySelectorAll('.theme-swatch').forEach(function(s){s.classList.remove('active');});
      swatch.classList.add('active'); render();
    });
  });

  const setOv=document.getElementById('set-ov');
  if(setOv)setOv.addEventListener('click',function(e){if(e.target===setOv)hideOverlay();});

  let resetConf=false;
  q('st-reset-all',function(){
    const btn=document.getElementById('st-reset-all');
    if(!resetConf){
      resetConf=true;
      if(btn){btn.textContent='确定清除吗？（不可恢复）';btn.style.fontWeight='600';}
      setTimeout(function(){resetConf=false;if(btn){btn.textContent='清除所有本地数据';btn.style.fontWeight='';}},4000);
    } else {
      [KEYS.SAVE,KEYS.SET,KEYS.STREAK,KEYS.HIST,KEYS.NOTES].forEach(function(k){Store.del(k);});
      HIST=[];SETTINGS={taskCount:3,defaultDuration:25,sound:true,theme:'system'};
      applyTheme('system');hideOverlay();doReset();
    }
  });
}

function bindHistory(){
  q('close-hist',hideOverlay);
  const hov=document.getElementById('hist-ov');
  if(hov)hov.addEventListener('click',function(e){if(e.target===hov)hideOverlay();});
  let clearConf=false;
  q('clear-hist',function(){
    const btn=document.getElementById('clear-hist');
    if(!clearConf){clearConf=true;if(btn)btn.textContent='确定清空吗？';
      setTimeout(function(){clearConf=false;if(btn)btn.textContent='清空历史记录';},3000);
    } else {HIST=[];Store.del(KEYS.HIST);hideOverlay();render();}
  });
}

/* ─── Actions ─── */
function doLock(){
  S.tasks=S.tasks.map(function(t){return Object.assign({},t,{text:t.text.trim()});});
  S.suggested=suggestTask();S.chosen=S.suggested;S.phase='choose';save();render();
}
function goEdit(){clearInterval(_timer);S.running=false;S.paused=false;S.phase='plan';render();}
function doReset(){clearInterval(_timer);_rolloverTasks=[];S=newState();Store.del(KEYS.SAVE);render();}

/* ─── Keyboard ─── */
document.addEventListener('keydown',function(e){
  const tag=((document.activeElement||{}).tagName||'');
  const isInput=tag==='INPUT'||tag==='TEXTAREA';
  if(e.key==='Escape'){
    if(document.getElementById('set-ov')||document.getElementById('hist-ov')){hideOverlay();return;}
    if(S.phase==='choose'){S.phase='plan';render();return;}
    if(S.phase==='focus'){clearInterval(_timer);S.running=false;S.phase='plan';render();return;}
  }
  if(isInput)return;
  if((e.key===' '||e.code==='Space')&&S.phase==='focus'){e.preventDefault();S.running?pauseTimer():startTimer();}
  if(e.key==='Enter'){
    if(S.phase==='plan'){const b=document.getElementById('btn-lock');if(b&&!b.disabled)doLock();}
    if(S.phase==='choose'){const b=document.getElementById('btn-go');if(b&&!b.disabled)b.click();}
  }
  if((e.key==='e'||e.key==='E')&&S.phase!=='plan'&&S.phase!=='review'&&S.phase!=='summary')goEdit();
  if(['1','2','3','4','5','6'].indexOf(e.key)!==-1&&S.phase==='choose'){
    const avail=availableTasks();const t=avail[parseInt(e.key)-1];if(t)launchFocus(t.text,t.energy);
  }
});

/* ─── Init ─── */
loadSettings();loadStreak();load();
applyTheme(SETTINGS.theme||'system');
render();
if(S.phase==='focus'&&S.timeLeft>0){S.paused=true;renderAppContent();}

}catch(err){
  const el=document.getElementById('app');
  if(el)el.innerHTML='<div style="padding:24px;margin:20px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px"><strong style="color:#dc2626">Error</strong><br><span style="font-size:13px;color:#991b1b">'+String(err.message)+'</span></div>';
  console.error('Launchpad Error:',err);
}
})();
</script>
